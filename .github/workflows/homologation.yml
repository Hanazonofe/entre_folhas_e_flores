name: Homologation
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit completo a publicar no sandbox (40 caracteres)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: homologation
  cancel-in-progress: false
jobs:
  validate:
    name: Validate candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate SHA syntax
        env: {CANDIDATE: '${{ inputs.sha }}'}
        run: '[[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Require commit in repository branches
        env: {CANDIDATE: '${{ inputs.sha }}'}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git for-each-ref --contains "$CANDIDATE" --format='%(refname)' refs/remotes/origin/ | grep -q .
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: JavaScript
        run: npm test && npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Python and disposable PostgreSQL
        env: {PYTHON: python}
        run: |
          pip install -r backend/requirements-dev.lock
          python -m ruff check backend/pdv --select F
          bash scripts/test-database.sh
      - name: Validate isolated Compose
        env:
          HOMOL_SHA: ${{ inputs.sha }}
          HOMOL_LAN_IP: 192.168.18.31
          HOMOL_SECRETS_DIR: /tmp/homol-ci-secrets
        run: |
          mkdir -p "$HOMOL_SECRETS_DIR"
          touch "$HOMOL_SECRETS_DIR"/{owner_password,api_password,backup_password,owner_url,api_url,duckdns_token,admin_password}
          docker compose -f compose.homol.yaml config --quiet
      - name: Provisioning and isolation assertions
        run: python scripts/test-homologation-config.py
  deploy:
    name: Deploy homologation
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: homologation
      url: https://entre-folhas-homol.duckdns.org:8443
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.sha }}'}
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOMOL_SSH_KNOWN_HOSTS: ${{ secrets.HOMOL_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$HOMOL_SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOMOL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy exact tested commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          CANDIDATE: ${{ inputs.sha }}
        run: |
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$CANDIDATE'" < scripts/deploy-homologation.sh
      - name: Verify HTTPS from runner
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          CANDIDATE: ${{ inputs.sha }}
        run: |
          curl --max-time 20 --retry 3 --retry-delay 2 --retry-all-errors -fsS \
            --resolve "entre-folhas-homol.duckdns.org:8443:$DEPLOY_HOST" \
            https://entre-folhas-homol.duckdns.org:8443/api/health > /tmp/homol-health.json
          python -c 'import json,sys; p=json.load(open("/tmp/homol-health.json")); assert p["status"]=="ok" and p["environment"]=="homologation" and p["release_sha"]==sys.argv[1]' "$CANDIDATE"
