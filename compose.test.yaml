name: entre-folhas-pdv-test

services:
  db:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    pull_policy: never
    tmpfs:
      - /var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pdv-test-only
      POSTGRES_DB: pdv_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdv_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  test:
    image: ${PDV_TEST_IMAGE:-entre-folhas-pdv-test-test:latest}
    volumes:
      - ./backend:/app/backend:ro
      - ./tests:/app/tests:ro
      - ./deployment:/app/deployment:ro
    build:
      context: .
      dockerfile: deployment/Dockerfile.test
      network: none
    environment:
      PYTHONPATH: /app/backend
      PDV_TEST_TARGET: db:5432
      IMPORT_TEST_DATABASE_URL: postgresql+psycopg://postgres:pdv-test-only@db:5432/pdv_import_test
      TEST_OWNER_URL: postgresql+psycopg://postgres:pdv-test-only@db:5432/pdv_test
      DATABASE_URL: postgresql+psycopg://postgres:pdv-test-only@db:5432/pdv_test
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -eu

        echo "=== Migrations ==="
        python -m pytest tests/safety tests/database -v

        echo "=== Roles ==="
        python - <<'PY'
        import psycopg

        conn = psycopg.connect(
            "postgresql://postgres:pdv-test-only@db:5432/pdv_test",
            autocommit=True,
        )

        with conn.cursor() as cur:
            cur.execute("CREATE DATABASE pdv_import_test")
            cur.execute("CREATE ROLE pdv_api LOGIN PASSWORD 'pdv-api-test-only'")
            cur.execute("CREATE ROLE pdv_backup LOGIN PASSWORD 'pdv-backup-test-only'")

        conn.close()
        PY

        echo "=== Grants ==="
        python - <<'PY'
        import psycopg
        from pathlib import Path

        sql = Path("/app/deployment/grants.sql").read_text()

        with psycopg.connect(
            "postgresql://postgres:pdv-test-only@db:5432/pdv_test",
            autocommit=True,
        ) as conn:
            with conn.cursor() as cur:
                cur.execute(sql)
        PY

        echo "=== Pytest ==="
        export DATABASE_URL="postgresql+psycopg://pdv_api:pdv-api-test-only@db:5432/pdv_test"
        python -m pytest backend/tests tests/importer -v

# Only the disposable database is reachable; no external route for either service.
networks:
  default:
    internal: true
