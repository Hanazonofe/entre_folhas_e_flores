<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vendas realizadas | Entre Folhas e Flores</title>
  <style>
    :root {
      --bg: #f5f7f2;
      --card: #ffffff;
      --primary: #2f6b45;
      --primary-dark: #245538;
      --accent: #d9ead7;
      --text: #1f2a23;
      --muted: #68756d;
      --danger: #b83232;
      --warning: #8a5c00;
      --border: #dbe3dc;
      --shadow: 0 18px 50px rgba(31, 42, 35, 0.11);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #e8f3e6, transparent 38%), var(--bg);
      color: var(--text);
    }

    header, main { padding-inline: clamp(16px, 4vw, 48px); }
    header { padding-top: 28px; padding-bottom: 12px; }
    main { padding-top: 16px; padding-bottom: 42px; }

    .topbar, .page-heading, .sale-header, .row, .actions {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .topbar, .page-heading, .sale-header, .row { justify-content: space-between; }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--primary-dark);
      font-weight: 800;
      letter-spacing: -0.03em;
      font-size: clamp(1.5rem, 3vw, 2.25rem);
    }

    .brand span {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--accent);
      box-shadow: inset 0 0 0 1px #c8dec6;
    }

    nav { display: flex; gap: 10px; flex-wrap: wrap; }

    nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 14px;
      border: 1px solid #cfe0cf;
      border-radius: 999px;
      background: #fff;
      color: var(--primary-dark);
      font-weight: 800;
      text-decoration: none;
    }

    nav a.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(219, 227, 220, 0.9);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: clamp(18px, 3vw, 28px);
    }

    h1, h2, h3 { margin: 0; letter-spacing: -0.04em; }
    h1 { font-size: clamp(2rem, 5vw, 3.7rem); line-height: 0.95; }
    p { color: var(--muted); line-height: 1.55; }

    .filters {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(160px, 220px);
      gap: 12px;
      margin: 24px 0;
    }

    label { display: block; font-weight: 800; margin-bottom: 8px; }
    input, select, button, textarea {
      width: 100%;
      font: inherit;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    input, select, textarea {
      padding: 13px 15px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    textarea { min-height: 78px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(47, 107, 69, 0.12); }

    button {
      cursor: pointer;
      border: 0;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      padding: 11px 14px;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    button:hover { background: var(--primary-dark); transform: translateY(-1px); }
    button.secondary { background: #eef4ee; color: var(--primary-dark); border: 1px solid #cfe0cf; }
    button.danger { background: #fff0f0; color: var(--danger); border: 1px solid #f0c8c8; }
    button.warning { background: #fff6df; color: var(--warning); border: 1px solid #edd79b; }
    button.small { width: auto; min-width: 108px; }

    .sales-list { display: grid; gap: 14px; }

    .sale-card {
      border: 1px solid var(--border);
      border-radius: 22px;
      background: #fff;
      padding: 18px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 900;
      background: var(--accent);
      color: var(--primary-dark);
    }

    .status.cancelled { background: #fff0f0; color: var(--danger); }
    .status.edited { background: #fff6df; color: var(--warning); }
    .meta { color: var(--muted); font-size: 0.95rem; }
    .items { margin: 14px 0; display: grid; gap: 8px; }

    .item-line {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #edf2ee;
    }

    .totals {
      display: grid;
      gap: 8px;
      max-width: 420px;
      margin-left: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .total-final { color: var(--primary-dark); font-size: 1.25rem; font-weight: 900; }
    .empty { padding: 34px; border: 1px dashed #bac8bd; border-radius: 18px; text-align: center; color: var(--muted); }
    .modal { position: fixed; inset: 0; display: none; place-items: center; padding: 18px; background: rgba(31, 42, 35, 0.42); }
    .modal.show { display: grid; }
    .modal .card { width: min(720px, 100%); max-height: 92vh; overflow: auto; }
    .edit-grid { display: grid; grid-template-columns: 1fr 120px 140px; gap: 10px; align-items: end; margin: 12px 0; }
    .notice { min-height: 24px; font-weight: 800; color: var(--primary-dark); }

    @media (max-width: 760px) {
      .filters, .edit-grid { grid-template-columns: 1fr; }
      .sale-header, .page-heading { align-items: flex-start; }
      button.small { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand"><span>🌿</span> Entre Folhas e Flores</div>
      <nav aria-label="Navegação principal">
        <a href="pdv.html">Nova venda</a>
        <a class="active" href="vendas.html">Vendas realizadas</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="page-heading">
        <div>
          <h1>Registro geral de vendas</h1>
          <p>Consulte o que foi adquirido, quando a venda aconteceu, altere observações/valores e cancele registros quando necessário.</p>
        </div>
        <a href="pdv.html"><button class="small" type="button">+ Nova venda</button></a>
      </div>

      <div class="filters">
        <div>
          <label for="searchSales">Consultar venda</label>
          <input id="searchSales" type="search" placeholder="Busque por produto, código, pagamento ou ID" />
        </div>
        <div>
          <label for="statusFilter">Status</label>
          <select id="statusFilter">
            <option value="all">Todas</option>
            <option value="completed">Concluídas</option>
            <option value="edited">Alteradas</option>
            <option value="cancelled">Canceladas</option>
          </select>
        </div>
      </div>

      <div id="salesList" class="sales-list"></div>
      <p id="notice" class="notice"></p>
    </section>
  </main>

  <div id="editModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <form id="editForm" class="card">
      <div class="page-heading">
        <h2 id="editTitle">Alterar venda</h2>
        <button class="small secondary" type="button" id="closeModal">Fechar</button>
      </div>
      <input type="hidden" id="saleId" />

      <label for="editPayment">Método de pagamento</label>
      <select id="editPayment">
        <option value="credit">Cartão de crédito</option>
        <option value="debit">Débito</option>
        <option value="pix">Pix</option>
        <option value="cash">Dinheiro</option>
      </select>

      <div id="editItems"></div>

      <label for="editDiscount">Desconto em R$</label>
      <input id="editDiscount" type="number" min="0" step="0.01" />

      <label for="editNotes">Observações da alteração</label>
      <textarea id="editNotes" placeholder="Ex.: cliente trocou produto, ajuste de desconto..."></textarea>

      <div class="totals">
        <div class="row"><span>Subtotal ajustado</span><strong id="editSubtotal">R$ 0,00</strong></div>
        <div class="row total-final"><span>Total ajustado</span><span id="editTotal">R$ 0,00</span></div>
      </div>

      <button type="submit">Salvar alterações</button>
    </form>
  </div>

  <script>
    const SALES_STORAGE_KEY = "entre-folhas-vendas";
    const formatter = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
    const paymentLabels = { credit: "Cartão de crédito", debit: "Débito", pix: "Pix", cash: "Dinheiro" };

    const salesList = document.querySelector("#salesList");
    const searchSales = document.querySelector("#searchSales");
    const statusFilter = document.querySelector("#statusFilter");
    const notice = document.querySelector("#notice");
    const editModal = document.querySelector("#editModal");
    const editForm = document.querySelector("#editForm");
    const editItems = document.querySelector("#editItems");
    const editSubtotal = document.querySelector("#editSubtotal");
    const editTotal = document.querySelector("#editTotal");

    function normalize(value) {
      return String(value || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    function getSales() {
      try {
        return JSON.parse(localStorage.getItem(SALES_STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveSales(sales) {
      localStorage.setItem(SALES_STORAGE_KEY, JSON.stringify(sales));
    }

    function formatDate(isoDate) {
      return new Intl.DateTimeFormat("pt-BR", { dateStyle: "short", timeStyle: "short" }).format(new Date(isoDate));
    }

    function getSaleSubtotal(sale) {
      return sale.items.reduce((total, item) => total + Number(item.price) * Number(item.quantity), 0);
    }

    function getStatusLabel(status) {
      return ({ completed: "Concluída", edited: "Alterada", cancelled: "Cancelada" })[status] || "Concluída";
    }

    function getFilteredSales() {
      const query = normalize(searchSales.value);
      const status = statusFilter.value;
      return getSales().filter(sale => {
        const text = normalize([
          sale.id,
          sale.status,
          sale.paymentLabel,
          sale.items.map(item => `${item.name} ${item.barcode}`).join(" ")
        ].join(" "));
        const matchesQuery = !query || text.includes(query);
        const matchesStatus = status === "all" || sale.status === status;
        return matchesQuery && matchesStatus;
      });
    }

    function renderSales() {
      const sales = getFilteredSales();
      if (!sales.length) {
        salesList.innerHTML = '<div class="empty">Nenhuma venda encontrada. Feche uma venda na tela de PDV para criar o primeiro registro.</div>';
        return;
      }

      salesList.innerHTML = sales.map(sale => `
        <article class="sale-card">
          <div class="sale-header">
            <div>
              <h3>Venda #${sale.id.slice(0, 8)}</h3>
              <div class="meta">Feita em ${formatDate(sale.createdAt)} • ${sale.paymentLabel}</div>
              ${sale.updatedAt ? `<div class="meta">Última alteração em ${formatDate(sale.updatedAt)}</div>` : ""}
            </div>
            <span class="status ${sale.status}">${getStatusLabel(sale.status)}</span>
          </div>

          <div class="items">
            ${sale.items.map(item => `
              <div class="item-line">
                <div><strong>${item.name}</strong><br><span class="meta">Cód. ${item.barcode} • ${formatter.format(Number(item.price))} cada</span></div>
                <strong>${item.quantity} un. • ${formatter.format(Number(item.price) * Number(item.quantity))}</strong>
              </div>
            `).join("")}
          </div>

          ${sale.notes ? `<p><strong>Observações:</strong> ${sale.notes}</p>` : ""}

          <div class="totals">
            <div class="row"><span>Subtotal</span><strong>${formatter.format(sale.subtotal)}</strong></div>
            <div class="row"><span>Desconto</span><strong>${formatter.format(sale.discount || 0)}</strong></div>
            ${sale.paymentMethod === "cash" ? `<div class="row"><span>Recebido</span><strong>${formatter.format(sale.cashReceived || sale.total)}</strong></div><div class="row"><span>Troco</span><strong>${formatter.format(sale.change || 0)}</strong></div>` : ""}
            <div class="row total-final"><span>Total</span><span>${formatter.format(sale.total)}</span></div>
          </div>

          <div class="actions">
            <button class="small secondary" type="button" onclick="openEdit('${sale.id}')" ${sale.status === "cancelled" ? "disabled" : ""}>Alterar</button>
            <button class="small warning" type="button" onclick="cancelSale('${sale.id}')" ${sale.status === "cancelled" ? "disabled" : ""}>Cancelar</button>
          </div>
        </article>
      `).join("");
    }

    function cancelSale(id) {
      if (!confirm("Tem certeza que deseja cancelar esta venda?")) return;
      const sales = getSales().map(sale => sale.id === id ? {
        ...sale,
        status: "cancelled",
        updatedAt: new Date().toISOString(),
        notes: `${sale.notes ? `${sale.notes}\n` : ""}Venda cancelada.`
      } : sale);
      saveSales(sales);
      notice.textContent = "Venda cancelada com sucesso.";
      renderSales();
    }

    function openEdit(id) {
      const sale = getSales().find(item => item.id === id);
      if (!sale) return;
      document.querySelector("#saleId").value = sale.id;
      document.querySelector("#editPayment").value = sale.paymentMethod;
      document.querySelector("#editDiscount").value = sale.discount || 0;
      document.querySelector("#editNotes").value = sale.notes || "";
      editItems.innerHTML = sale.items.map((item, index) => `
        <div class="edit-grid">
          <div>
            <label for="item-name-${index}">Produto</label>
            <input id="item-name-${index}" data-field="name" data-index="${index}" value="${item.name}" />
          </div>
          <div>
            <label for="item-qty-${index}">Qtd.</label>
            <input id="item-qty-${index}" data-field="quantity" data-index="${index}" type="number" min="1" step="1" value="${item.quantity}" />
          </div>
          <div>
            <label for="item-price-${index}">Preço</label>
            <input id="item-price-${index}" data-field="price" data-index="${index}" type="number" min="0" step="0.01" value="${item.price}" />
          </div>
        </div>
      `).join("");
      editModal.dataset.items = JSON.stringify(sale.items);
      updateEditTotals();
      editModal.classList.add("show");
    }

    function getEditedItems() {
      const original = JSON.parse(editModal.dataset.items || "[]");
      return original.map((item, index) => ({
        ...item,
        name: document.querySelector(`[data-index="${index}"][data-field="name"]`).value.trim() || item.name,
        quantity: Math.max(1, Number(document.querySelector(`[data-index="${index}"][data-field="quantity"]`).value) || 1),
        price: Math.max(0, Number(document.querySelector(`[data-index="${index}"][data-field="price"]`).value) || 0)
      }));
    }

    function updateEditTotals() {
      const subtotal = getEditedItems().reduce((total, item) => total + item.price * item.quantity, 0);
      const discount = Math.max(0, Number(document.querySelector("#editDiscount").value) || 0);
      editSubtotal.textContent = formatter.format(subtotal);
      editTotal.textContent = formatter.format(Math.max(0, subtotal - discount));
    }

    editForm.addEventListener("input", updateEditTotals);
    editForm.addEventListener("submit", event => {
      event.preventDefault();
      const id = document.querySelector("#saleId").value;
      const items = getEditedItems();
      const subtotal = items.reduce((total, item) => total + item.price * item.quantity, 0);
      const discount = Math.max(0, Number(document.querySelector("#editDiscount").value) || 0);
      const total = Math.max(0, subtotal - discount);
      const paymentMethod = document.querySelector("#editPayment").value;

      const sales = getSales().map(sale => sale.id === id ? {
        ...sale,
        items,
        subtotal,
        discount,
        total,
        paymentMethod,
        paymentLabel: paymentLabels[paymentMethod],
        status: "edited",
        updatedAt: new Date().toISOString(),
        notes: document.querySelector("#editNotes").value.trim()
      } : sale);

      saveSales(sales);
      editModal.classList.remove("show");
      notice.textContent = "Venda alterada com sucesso.";
      renderSales();
    });

    document.querySelector("#closeModal").addEventListener("click", () => editModal.classList.remove("show"));
    searchSales.addEventListener("input", renderSales);
    statusFilter.addEventListener("change", renderSales);
    renderSales();
  </script>
</body>
</html>
